<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1>Dice Roller</h1>
        <label for="number">Number of dice:</label>
        <input type="number" id="number" min="1" max="10" >
        <button class="rollButton" onclick="rollDice()">Roll Dice</button>
        <p id="result">Press the button to roll the dice!</p>
        <div id="diceResult"></div>
        <div id="diceImages"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
